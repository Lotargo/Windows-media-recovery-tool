name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'CHANGELOG.md',
            '.gitignore',
            'Cargo.toml',
            'Cargo.lock',
            'global.json',
            'Directory.Build.props',
            'WindowsMediaRecovery.sln',
            'src/desktop/MediaRecovery.Desktop/MediaRecovery.Desktop.csproj',
            'src/worker/media-recovery-worker/Cargo.toml',
            'src/rust/recovery-core/Cargo.toml',
            'src/rust/hardware-profile/Cargo.toml',
            'src/rust/windows-storage/Cargo.toml',
            'src/rust/windows-storage/src/enumeration.rs',
            'protocol/recovery-protocol/Cargo.toml',
            'plan/README.md',
            'plan/01-product-scope.md',
            'plan/02-architecture.md',
            'plan/03-release-roadmap.md',
            'plan/04-performance-and-runtime.md',
            'plan/05-distribution-and-trust.md',
            'plan/06-ci-cd.md'
          )

          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $missing += $path
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required project files:`n$($missing -join "`n")"
            exit 1
          }

      - name: Guard against committed private signing material
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @('.pfx', '.p12', '.key') -or
              $_.Name -match '(?i)signing.*secret|codesign.*secret'
            }

          if ($forbidden) {
            $paths = $forbidden.FullName -join "`n"
            Write-Error "Potential signing/private key material is committed:`n$paths"
            exit 1
          }

      - name: Validate Release 1 scope invariants
        shell: pwsh
        run: |
          $scope = Get-Content -LiteralPath 'plan/01-product-scope.md' -Raw

          $invariants = @(
            @{ Name = 'Windows-only target'; Pattern = '(?im)^\s*-\s*Windows only\.' },
            @{ Name = 'native x86 target'; Pattern = '(?im)^\s*-\s*Native x86 build\.' },
            @{ Name = 'native x64 target'; Pattern = '(?im)^\s*-\s*Native x64 build\.' },
            @{ Name = 'native ARM64 target'; Pattern = '(?im)^\s*-\s*Native ARM64 build\.' },
            @{ Name = 'AI excluded from Release 1'; Pattern = '(?im)^\s*-\s*AI restoration, AI reconstruction, or AI classification;' },
            @{ Name = 'generic document recovery excluded'; Pattern = '(?im)^\s*-\s*generic document recovery;' }
          )

          foreach ($invariant in $invariants) {
            if ($scope -notmatch $invariant.Pattern) {
              Write-Error "Release 1 scope invariant missing: $($invariant.Name)"
              exit 1
            }
          }

  rust-format:
    name: Rust format
    needs: repository-structure
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rustfmt
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt
          rustfmt --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

  rust:
    name: Rust ${{ matrix.arch }}
    needs: repository-structure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            rust_target: i686-pc-windows-msvc
            expected_arch: x86
            expected_pointer_width: 32
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            expected_arch: x64
            expected_pointer_width: 64
          - arch: arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
            expected_arch: arm64
            expected_pointer_width: 64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable and target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.rust_target }}'
          rustup component add clippy
          rustc --version
          cargo --version

      - name: Run Rust tests
        run: cargo test --workspace --locked --target ${{ matrix.rust_target }}

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --locked --target ${{ matrix.rust_target }} -- -D warnings

      - name: Build release worker
        run: cargo build --workspace --release --locked --target ${{ matrix.rust_target }}

      - name: Verify worker capabilities
        shell: pwsh
        run: |
          $worker = '.\target\${{ matrix.rust_target }}\release\media-recovery-worker.exe'
          $capabilities = (& $worker --capabilities) | ConvertFrom-Json

          if ($capabilities.protocol_version -ne 1) {
            throw "Unexpected protocol version: $($capabilities.protocol_version)"
          }

          if ($capabilities.architecture -ne '${{ matrix.expected_arch }}') {
            throw "Expected architecture '${{ matrix.expected_arch }}', got '$($capabilities.architecture)'"
          }

          if (-not $capabilities.raw_image_source) {
            throw 'Stage 1 worker must report RAW disk image support.'
          }

          if (-not $capabilities.physical_drive_access) {
            throw 'Stage 1 worker must report profiled read-only physical drive support.'
          }

      - name: Verify hardware profile
        shell: pwsh
        run: |
          $worker = '.\target\${{ matrix.rust_target }}\release\media-recovery-worker.exe'
          $profile = (& $worker --hardware-profile) | ConvertFrom-Json

          if ($profile.architecture -ne '${{ matrix.expected_arch }}') {
            throw "Hardware profile architecture mismatch: $($profile.architecture)"
          }

          if ($profile.pointer_width_bits -ne ${{ matrix.expected_pointer_width }}) {
            throw "Unexpected pointer width: $($profile.pointer_width_bits)"
          }

          if ($profile.logical_processors -lt 1) {
            throw 'Logical processor count must be at least one.'
          }

      - name: Verify storage source discovery
        shell: pwsh
        run: |
          $worker = '.\target\${{ matrix.rust_target }}\release\media-recovery-worker.exe'
          $discovery = (& $worker --list-sources) | ConvertFrom-Json

          if ($null -eq $discovery.physical_drives) {
            throw 'Storage discovery must return a physical_drives collection.'
          }

          if ($null -eq $discovery.mounted_volumes) {
            throw 'Storage discovery must return a mounted_volumes collection.'
          }

          if (@($discovery.mounted_volumes).Count -lt 1) {
            throw 'Windows runner should expose at least one mounted volume.'
          }

      - name: Verify RAW disk image source
        shell: pwsh
        run: |
          $worker = '.\target\${{ matrix.rust_target }}\release\media-recovery-worker.exe'
          $fixture = Join-Path $env:RUNNER_TEMP 'stage1-raw-image.img'
          [System.IO.File]::WriteAllBytes($fixture, [byte[]](0..255))
          $info = (& $worker --raw-image-info $fixture) | ConvertFrom-Json

          if ($info.length_bytes -ne 256) {
            throw "Unexpected RAW image length: $($info.length_bytes)"
          }

          if ($info.logical_sector_size -ne 512) {
            throw "Unexpected RAW image logical sector size: $($info.logical_sector_size)"
          }

          Remove-Item -LiteralPath $fixture -Force

  desktop:
    name: WinUI ${{ matrix.arch }}
    needs: repository-structure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            platform: x86
          - arch: x64
            runner: windows-latest
            platform: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore WinUI solution
        run: dotnet restore WindowsMediaRecovery.sln -p:Platform=${{ matrix.platform }}

      - name: Build WinUI solution
        run: dotnet build WindowsMediaRecovery.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

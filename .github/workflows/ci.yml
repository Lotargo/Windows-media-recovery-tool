name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-structure:
    name: Repository structure
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required project files
        shell: pwsh
        run: |
          $required = @(
            'README.md',
            'CHANGELOG.md',
            '.gitignore',
            'Cargo.toml',
            'global.json',
            'Directory.Build.props',
            'WindowsMediaRecovery.sln',
            'src/desktop/MediaRecovery.Desktop/MediaRecovery.Desktop.csproj',
            'src/worker/media-recovery-worker/Cargo.toml',
            'src/rust/recovery-core/Cargo.toml',
            'protocol/recovery-protocol/Cargo.toml',
            'plan/README.md',
            'plan/01-product-scope.md',
            'plan/02-architecture.md',
            'plan/03-release-roadmap.md',
            'plan/04-performance-and-runtime.md',
            'plan/05-distribution-and-trust.md',
            'plan/06-ci-cd.md'
          )

          $missing = @()
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              $missing += $path
            }
          }

          if ($missing.Count -gt 0) {
            Write-Error "Missing required project files:`n$($missing -join "`n")"
            exit 1
          }

      - name: Guard against committed private signing material
        shell: pwsh
        run: |
          $forbidden = Get-ChildItem -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object {
              $_.Extension -in @('.pfx', '.p12', '.key') -or
              $_.Name -match '(?i)signing.*secret|codesign.*secret'
            }

          if ($forbidden) {
            $paths = $forbidden.FullName -join "`n"
            Write-Error "Potential signing/private key material is committed:`n$paths"
            exit 1
          }

      - name: Validate Release 1 scope invariants
        shell: pwsh
        run: |
          $scope = Get-Content -LiteralPath 'plan/01-product-scope.md' -Raw

          $invariants = @(
            @{ Name = 'Windows-only target'; Pattern = '(?im)^\s*-\s*Windows only\.' },
            @{ Name = 'native x86 target'; Pattern = '(?im)^\s*-\s*Native x86 build\.' },
            @{ Name = 'native x64 target'; Pattern = '(?im)^\s*-\s*Native x64 build\.' },
            @{ Name = 'native ARM64 target'; Pattern = '(?im)^\s*-\s*Native ARM64 build\.' },
            @{ Name = 'AI excluded from Release 1'; Pattern = '(?im)^\s*-\s*AI restoration, AI reconstruction, or AI classification;' },
            @{ Name = 'generic document recovery excluded'; Pattern = '(?im)^\s*-\s*generic document recovery;' }
          )

          foreach ($invariant in $invariants) {
            if ($scope -notmatch $invariant.Pattern) {
              Write-Error "Release 1 scope invariant missing: $($invariant.Name)"
              exit 1
            }
          }

  rust:
    name: Rust ${{ matrix.arch }}
    needs: repository-structure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            rust_target: i686-pc-windows-msvc
            expected_arch: x86
          - arch: x64
            runner: windows-latest
            rust_target: x86_64-pc-windows-msvc
            expected_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            rust_target: aarch64-pc-windows-msvc
            expected_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable and target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add '${{ matrix.rust_target }}'
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Check Rust formatting
        if: matrix.arch == 'x64'
        run: cargo fmt --all -- --check

      - name: Run Rust tests
        run: cargo test --workspace --target ${{ matrix.rust_target }}

      - name: Run Rust clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.rust_target }} -- -D warnings

      - name: Build release worker
        run: cargo build --workspace --release --target ${{ matrix.rust_target }}

      - name: Verify worker capabilities
        shell: pwsh
        run: |
          $worker = '.\target\${{ matrix.rust_target }}\release\media-recovery-worker.exe'
          $capabilities = (& $worker --capabilities) | ConvertFrom-Json

          if ($capabilities.protocol_version -ne 1) {
            throw "Unexpected protocol version: $($capabilities.protocol_version)"
          }

          if ($capabilities.architecture -ne '${{ matrix.expected_arch }}') {
            throw "Expected architecture '${{ matrix.expected_arch }}', got '$($capabilities.architecture)'"
          }

  desktop:
    name: WinUI ${{ matrix.arch }}
    needs: repository-structure
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            runner: windows-latest
            platform: x86
          - arch: x64
            runner: windows-latest
            platform: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            platform: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Show .NET environment
        run: dotnet --info

      - name: Restore WinUI solution
        run: dotnet restore WindowsMediaRecovery.sln -p:Platform=${{ matrix.platform }}

      - name: Build WinUI solution
        run: dotnet build WindowsMediaRecovery.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

[workspace]
resolver = "2"
members = [
    "protocol/recovery-protocol",
    "src/rust/recovery-core",
    "src/worker/media-recovery-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
recovery-core = { path = "src/rust/recovery-core" }
recovery-protocol = { path = "protocol/recovery-protocol" }
